plugins { id 'com.android.application' }
android {
    namespace 'com.snovi.browser'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.snovi.browser.experimental'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake {
            arguments '-DSNOVI_MOBILE=ON', "-DSNOVI_OPENSSL_ROOT=${rootProject.projectDir}/openssl", '-DOPENSSL_USE_STATIC_LIBS=TRUE'
            cppFlags '-std=c++17'
        } }
    }
    externalNativeBuild { cmake { path file('../../../CMakeLists.txt'); version '3.22.1' } }
    buildTypes { release { minifyEnabled false } }
}

// A real CA bundle is required; never package an app that silently skips TLS verification.
tasks.named('preBuild').configure {
    doFirst {
        if (!file('src/main/assets/ca-bundle.pem').exists()) throw new GradleException('Missing ca-bundle.pem; see README mobile build instructions')
    }
}
