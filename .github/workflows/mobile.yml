name: Mobile experimental builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android build tools
        run: Snovi/Mobile/scripts/prepare-android-sdk.sh
      - name: Build OpenSSL for Android
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          Snovi/Mobile/scripts/android-openssl.sh
      - name: Bundle trusted CA certificates
        run: |
          python -m pip install certifi==2026.10.23
          cp "$(python -c 'import certifi; print(certifi.where())')" Snovi/Mobile/Android/app/src/main/assets/ca-bundle.pem
      - name: Build APK
        working-directory: Snovi/Mobile/Android
        run: gradle --no-daemon assembleDebug
      - name: Validate APK signature and architecture
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Snovi/Mobile/Android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l Snovi/Mobile/Android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libsnovi_bridge.so'
          unzip -l Snovi/Mobile/Android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/x86_64/libsnovi_bridge.so'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb install Snovi/Mobile/Android/app/build/outputs/apk/debug/app-debug.apk
            python3 Snovi/Mobile/Android/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: Snovi-Android-debug-apk
          path: Snovi/Mobile/Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle trusted CA certificates
        run: |
          python -m pip install certifi==2026.10.23
          cp "$(python -c 'import certifi; print(certifi.where())')" Snovi/Mobile/iOS/ca-bundle.pem
      - name: Build and package unsigned iOS app
        run: Snovi/Mobile/scripts/ios-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Snovi-iOS-unsigned-ipa
          path: mobile-artifacts/Snovi-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
